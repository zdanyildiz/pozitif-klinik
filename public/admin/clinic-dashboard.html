<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pozitif Klinik Yönetim Paneli - Dashboard">
    <title>Klinik Paneli | Pozitif Klinik</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
    <!-- SweetAlert2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/dashboard.css" rel="stylesheet">
</head>

<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <a href="#" class="sidebar-logo">
                <div class="sidebar-logo-icon">
                    <i class="bi bi-hospital"></i>
                </div>
                <div class="sidebar-logo-text">
                    Pozitif
                    <span>Klinik Yönetimi</span>
                </div>
            </a>
        </div>

        <nav class="sidebar-nav">
            <div class="nav-section">
                <div class="nav-section-title">Hizmetler</div>
                <a href="patients.html" class="nav-link-custom">
                    <i class="bi bi-person-heart"></i>
                    Hastalar
                </a>
                <a href="appointments.html" class="nav-link-custom">
                    <i class="bi bi-calendar-check"></i>
                    Randevular
                </a>
                <a href="#" class="nav-link-custom active" id="navUsers">
                    <i class="bi bi-people"></i>
                    Personel
                </a>
            </div>

            <div class="nav-section">
                <div class="nav-section-title">Kurumsal</div>
                <a href="#" class="nav-link-custom">
                    <i class="bi bi-gear"></i>
                    Klinik Ayarları
                </a>
            </div>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Top Navbar -->
        <header class="top-navbar">
            <h1 class="navbar-title">Personel Yönetimi</h1>

            <div class="navbar-actions">
                <div class="user-profile me-3 d-none d-md-flex">
                    <div class="text-end me-2">
                        <div class="fw-bold" id="userName">-</div>
                        <div class="small text-secondary" id="userRole">-</div>
                    </div>
                    <div class="avatar">
                        <i class="bi bi-person-circle fs-2"></i>
                    </div>
                </div>
                <button class="btn-logout" id="logoutBtn">
                    <i class="bi bi-box-arrow-right"></i>
                    Çıkış Yap
                </button>
            </div>
        </header>

        <!-- Content Area -->
        <div class="content-area">
            <!-- Stats Grid -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon clinics">
                        <i class="bi bi-people"></i>
                    </div>
                    <div class="stat-value" id="totalUsersCount">0</div>
                    <div class="stat-label">Toplam Personel</div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon active">
                        <i class="bi bi-person-badge"></i>
                    </div>
                    <div class="stat-value" id="doctorCount">0</div>
                    <div class="stat-label">Doktor Sayısı</div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon users">
                        <i class="bi bi-headset"></i>
                    </div>
                    <div class="stat-value" id="secretaryCount">0</div>
                    <div class="stat-label">Sekreter Sayısı</div>
                </div>
            </div>

            <!-- Users Table -->
            <div class="table-card">
                <div class="table-card-header">
                    <h2 class="table-card-title">
                        <i class="bi bi-person-lines-fill"></i>
                        Personel Listesi
                    </h2>
                    <button class="btn-add" id="btnAddUser">
                        <i class="bi bi-person-plus"></i>
                        Yeni Personel Ekle
                    </button>
                </div>

                <div class="table-responsive">
                    <table class="table" id="usersTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Ad Soyad</th>
                                <th>Kullanıcı Adı</th>
                                <th>Rol</th>
                                <th>Durum</th>
                                <th>Kayıt Tarihi</th>
                                <th class="text-end">İşlemler</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <!-- Loading State -->
                            <tr id="loadingRow">
                                <td colspan="6">
                                    <div class="loading-state">
                                        <div class="loading-spinner"></div>
                                        <p>Personel listesi yükleniyor...</p>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- New User Modal -->
    <div class="modal fade" id="newUserModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-person-plus me-2"></i>
                        Yeni Personel Kaydı
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Kapat"></button>
                </div>
                <div class="modal-body">
                    <form id="newUserForm">
                        <div class="mb-3">
                            <label class="form-label">Ad Soyad</label>
                            <input type="text" class="form-control" name="name" id="newName"
                                placeholder="örn: Dr. Ahmet Yılmaz" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Kullanıcı Adı</label>
                            <input type="text" class="form-control" name="username" id="newUsername"
                                placeholder="örn: drahmet" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Şifre</label>
                            <input type="password" class="form-control" name="password" id="newPassword"
                                placeholder="••••••••" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Rol</label>
                            <select class="form-select" name="role" id="newRole" required>
                                <option value="" disabled selected>Rol Seçin</option>
                                <option value="doctor">Doktor</option>
                                <option value="secretary">Sekreter</option>
                                <option value="admin">Yönetici</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-cancel" data-bs-dismiss="modal">İptal</button>
                    <button type="button" class="btn btn-save" id="saveUserBtn">
                        <i class="bi bi-check-lg me-1"></i>
                        Kaydet
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Custom JS -->
    <script src="js/config.js?v=2"></script>
    <script src="js/clinic-dashboard.js?v=1"></script>
</body>

</html>
