<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pozitif Klinik Platform Yönetim Paneli - Giriş">
    <title>Admin Girişi | Pozitif Klinik Platform</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
    <!-- SweetAlert2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/login.css" rel="stylesheet">
</head>

<body>
    <!-- Animated Background Shapes -->
    <div class="bg-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <!-- Login Container -->
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <i class="bi bi-hospital"></i>
                </div>
                <h1>Platform Yönetimi</h1>
                <p>Yönetici hesabınızla giriş yapın</p>
            </div>

            <form id="loginForm" autocomplete="off">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="clinic_code" name="clinic_code"
                        placeholder="örn: pozitif" required autofocus>
                    <label for="clinic_code">
                        <i class="bi bi-building me-2"></i>Kurum Kodu
                    </label>
                </div>

                <div class="form-floating">
                    <input type="text" class="form-control" id="username" name="username" placeholder="Kullanıcı Adı"
                        required>
                    <label for="username">
                        <i class="bi bi-person me-2"></i>Kullanıcı Adı
                    </label>
                </div>

                <div class="form-floating password-wrapper">
                    <input type="password" class="form-control" id="password" name="password" placeholder="Şifre"
                        required>
                    <label for="password">
                        <i class="bi bi-lock me-2"></i>Şifre
                    </label>
                    <button type="button" class="password-toggle" aria-label="Şifreyi göster/gizle">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>

                <button type="submit" class="btn btn-login" id="btnLogin">
                    <span class="btn-text">Giriş Yap</span>
                </button>

                <div class="text-center mt-3">
                    <a href="#" id="toggleLoginMode" class="text-decoration-none small">
                        <i class="bi bi-shield-lock me-1"></i>Platform Yöneticisi Girişi
                    </a>
                </div>
            </form>

            <div class="footer-text">
                <a href="../" title="Ana sayfaya dön">
                    <i class="bi bi-arrow-left me-1"></i>Ana Sayfaya Dön
                </a>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Custom JS -->
    <script src="js/config.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
